apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaking
  namespace: kfchess
spec:
  # Deliberately 1, not N - found the hard way, by actually deploying 2 and
  # watching matching intermittently fail under real concurrent load (a
  # dry-run/schema validation would never have caught this). matchmaker.py's
  # _waiting dict is local, in-memory, per-process state - it holds the
  # actual live "connection handle" (_RemoteConnection) needed to signal a
  # match, not just a row in Redis. The seekers *queue* itself lives in
  # Redis and is genuinely shared (section 16.1's ZSET) - but the moment one
  # replica's _claim_opponent_within_elo_range finds a candidate there, it
  # calls self._waiting.pop(opponent_username) on its *own* local dict,
  # which is empty for anyone who actually connected through a *different*
  # replica. With 2 replicas and Kubernetes' per-connection (not
  # per-request) load balancing across them, two genuinely concurrent
  # seekers landing on different replicas silently fail to pair - each just
  # stays "waiting," with no error. Scaling this for real needs the same
  # kind of shared-state redesign game_allocator.py's own docstring already
  # flags for game-shard ("there's only ever one process/allocator") -  not
  # a replica-count change.
  replicas: 1
  selector:
    matchLabels:
      app: matchmaking
  template:
    metadata:
      labels:
        app: matchmaking
    spec:
      # Kubernetes auto-injects Docker-links-style env vars for every
      # Service in this namespace (REDIS_PORT=tcp://<ip>:6379, etc.) -
      # colliding with this app's own REDIS_PORT/SHARD_PORT-shaped env
      # vars (kungfu_chess/server/redis_client.py and friends), which
      # expect a bare port number, not a URL. Disabling this legacy
      # feature is the standard fix, not a workaround specific to this
      # project.
      enableServiceLinks: false
      containers:
        - name: matchmaking
          image: kfchess:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_ROLE
              value: matchmaking
            - name: HOST
              value: "0.0.0.0"
            - name: ACCOUNTS_SERVICE_URL
              value: http://api:8766
            - name: REDIS_HOST
              value: redis
          ports:
            - containerPort: 8768
            - containerPort: 9100
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9100
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9100
            initialDelaySeconds: 10
            periodSeconds: 15
---
# ClusterIP only (default type, no external exposure) - Server_Design.md
# section 2: reachable only from the WS Gateway over the cluster network,
# same isolation reasoning docker-compose.yml's missing `ports:` already
# established for this role.
apiVersion: v1
kind: Service
metadata:
  name: matchmaking
  namespace: kfchess
spec:
  selector:
    app: matchmaking
  ports:
    - name: http
      port: 8768
      targetPort: 8768
    - name: metrics
      port: 9100
      targetPort: 9100
