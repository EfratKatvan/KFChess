apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaking
  namespace: kfchess
spec:
  # Back to 2 (previously pinned to 1 - see git history on this file for
  # the original incident writeup) now that matchmaker.py no longer keeps
  # any per-connection state in a local, in-memory dict: the seekers queue
  # was already a shared Redis ZSET (section 16.1), pairing *decisions* are
  # now made by exactly one replica at a time via a Redis lease
  # (matchmaker_leader.py's MatchmakerLeaderElection, driven by
  # matchmaking_service.py's own periodic tick loop - see run_matching_tick
  # in matchmaker.py), and every other per-connection map (active
  # connections, room membership, pending-reconnect routing, session
  # tokens) moved into Redis too (see matchmaker.py's __init__ for the
  # full list and the one deliberately-deferred gap: a replica that
  # crashes without ever calling /disconnect leaks a stale "already
  # logged in" entry - needs a heartbeat/liveness TTL to fully close,
  # not bundled into this fix).
  replicas: 2
  selector:
    matchLabels:
      app: matchmaking
  template:
    metadata:
      labels:
        app: matchmaking
    spec:
      # Kubernetes auto-injects Docker-links-style env vars for every
      # Service in this namespace (REDIS_PORT=tcp://<ip>:6379, etc.) -
      # colliding with this app's own REDIS_PORT/SHARD_PORT-shaped env
      # vars (kungfu_chess/server/redis_client.py and friends), which
      # expect a bare port number, not a URL. Disabling this legacy
      # feature is the standard fix, not a workaround specific to this
      # project.
      enableServiceLinks: false
      containers:
        - name: matchmaking
          image: kfchess:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_ROLE
              value: matchmaking
            - name: HOST
              value: "0.0.0.0"
            - name: ACCOUNTS_SERVICE_URL
              value: http://api:8766
            - name: REDIS_HOST
              value: redis
          ports:
            - containerPort: 8768
            - containerPort: 9100
          # timeoutSeconds explicit, not left at Kubernetes' own 1s default -
          # see ws-gateway.yaml's own note: found the hard way, watching
          # this pod get SIGKILL'd (exit 137) by its own liveness probe
          # under real concurrent test load on a resource-constrained
          # single-node dev cluster.
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9100
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9100
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
---
# ClusterIP only (default type, no external exposure) - Server_Design.md
# section 2: reachable only from the WS Gateway over the cluster network,
# same isolation reasoning docker-compose.yml's missing `ports:` already
# established for this role.
apiVersion: v1
kind: Service
metadata:
  name: matchmaking
  namespace: kfchess
spec:
  selector:
    app: matchmaking
  ports:
    - name: http
      port: 8768
      targetPort: 8768
    - name: metrics
      port: 9100
      targetPort: 9100
