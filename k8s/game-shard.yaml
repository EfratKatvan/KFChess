apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-shard
  namespace: kfchess
spec:
  # Still 1, not 2 - tried 2 directly against a real cluster (not just
  # reasoned about) while building this stage's own crash-recovery work
  # below, and it reproduced a real, different bug: a brand-new room's
  # two HostSeatMessage relay connections (white's and black's) are two
  # *independent* TCP connections, each dialing the fixed SHARD_HOST
  # Service name separately - Kubernetes' own per-connection
  # load-balancing (no session affinity) can and does send them to
  # *different* replicas, and neither ever sees both seats, so
  # _handle_host_seat's own pairing wait reliably times out for roughly
  # half of all matches. Naively assuming "Kubernetes' own load-balancing
  # spreads new rooms across replicas for free" (an earlier version of
  # this exact comment) was wrong - that reasoning holds for a *single*
  # relay connection needing *any* live replica (matchmaking-style), not
  # for two independent connections that both need to land on the
  # *same* one. Fixing this for real needs the two seats' connections
  # routed together - a consistent hash of room_id over the actual set
  # of live replica pod IPs (a headless Service, not this one, so DNS
  # resolves every replica, not a single load-balanced VIP) - a
  # separate, still-undone piece of work, not a config change.
  #
  # What *is* done and real: crash recovery for whichever single
  # replica is currently running. room_shard_registry.py persists each
  # room's white/black pairing durably (save_meta/load_meta - separate
  # from the lease's own TTL'd key, which is what makes a crashed
  # owner's lease actually expire and disappear), and game_shard.py's
  # own _handle_reconnect rebuilds the room from that plus JetStream
  # replay when a replacement pod (still just one at a time) takes over
  # after this one crashes. ws_gateway.py's own relay loop retries as a reconnect
  # automatically when the Shard side of a relay session drops without
  # a clean close, giving that rebuild a real chance before falling
  # back to the lobby.
  replicas: 1
  selector:
    matchLabels:
      app: game-shard
  template:
    metadata:
      labels:
        app: game-shard
    spec:
      # See matchmaking.yaml's own comment - Kubernetes' auto-injected
      # Docker-links-style env vars (REDIS_PORT=tcp://<ip>:6379, etc.)
      # collide with this app's own same-named env vars.
      enableServiceLinks: false
      containers:
        - name: game-shard
          image: kfchess:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_ROLE
              value: game-shard
            - name: SHARD_HOST
              value: "0.0.0.0"  # this pod's own bind - see kungfu_chess/server/game_shard.py's comment
            # Without this, SHARD_ADVERTISED_ADDRESS defaults to
            # "{SHARD_HOST}:{SHARD_PORT}" = "0.0.0.0:8767" - a bind
            # address, not a dialable one. room_shard_registry.py stores
            # exactly this value as the lease a *different* process
            # later dials to reach this room (reconnect/spectate, and -
            # this stage's own addition - automatic recovery after a
            # crash) - a real, pre-existing bug that simply had nothing
            # exercising this path for real until ws_gateway.py's own
            # automatic retry-on-shard-crash started actually dialing
            # it. docker-compose.yml already set this correctly; the
            # k8s manifest never did.
            - name: SHARD_ADVERTISED_ADDRESS
              value: "game-shard:8767"
            - name: ACCOUNTS_SERVICE_URL
              value: http://api:8766
            - name: REDIS_HOST
              value: redis
            - name: NATS_URL
              value: nats://nats:4222
          ports:
            - containerPort: 8767
            - containerPort: 9100
          # timeoutSeconds explicit, not left at Kubernetes' own 1s default -
          # see ws-gateway.yaml's own note: found the hard way, watching a
          # pod get SIGKILL'd (exit 137) by its own liveness probe under
          # real concurrent test load on a resource-constrained
          # single-node dev cluster.
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9100
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9100
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
---
# ClusterIP only - Server_Design.md section 2: a Shard is reachable only
# from the WS Gateway, never from outside the cluster, never directly
# by a client - the same isolation docker-compose.yml's missing `ports:`
# already established for this role.
apiVersion: v1
kind: Service
metadata:
  name: game-shard
  namespace: kfchess
spec:
  selector:
    app: game-shard
  ports:
    - name: ws
      port: 8767
      targetPort: 8767
    - name: metrics
      port: 9100
      targetPort: 9100
