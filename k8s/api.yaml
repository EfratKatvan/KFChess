# Server_Design.md section 17, strategy B: same image as every other role
# (kfchess:latest, built from the repo's own Dockerfile) - only SERVICE_ROLE
# differs. See k8s/README.md for how to get that image into a K3s node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kfchess
spec:
  replicas: 2  # stateless, scales on request rate (Server_Design.md section 1) - free to add more
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # See matchmaking.yaml's own comment - not currently a collision
      # for this role's own env vars, but disabled here too for
      # consistency across every role, not just the affected ones.
      enableServiceLinks: false
      containers:
        - name: api
          image: kfchess:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_ROLE
              value: api
            - name: HOST
              value: "0.0.0.0"
          envFrom:
            - secretRef:
                name: postgres-credentials
          ports:
            - containerPort: 8766
            - containerPort: 9100  # metrics - see kungfu_chess/server/metrics.py
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9100
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9100
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kfchess
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8766
      targetPort: 8766
    - name: metrics
      port: 9100
      targetPort: 9100
