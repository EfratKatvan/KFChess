apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: kfchess
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kfchess
spec:
  replicas: 1  # Server_Design.md section 6: a real deployment replicates this (primary + synced
  # replicas, sharded by user_id hash once write throughput - section 9's ~83,000/sec - actually
  # demands it) - one replica matches this project's current, not-yet-at-that-scale reality.
  strategy:
    type: Recreate  # a single ReadWriteOnce volume can't be mounted by two pods at once during a rollout
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: postgres-credentials
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kfchess"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "kfchess"]
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kfchess
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
