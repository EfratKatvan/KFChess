# Server_Design.md section 18 (Stage 6): the one place this deployment
# uses a real Kubernetes Secret rather than a plain env var, even in a
# demo - Postgres credentials specifically, matching section 6's own
# emphasis that the accounts DB is the one piece of state that
# genuinely needs careful handling. Every other env var below is
# ordinary application config (URLs, hostnames), not a credential, and
# stays inline on its own Deployment for the same reason
# docker-compose.yml keeps them inline.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: kfchess
type: Opaque
stringData:
  POSTGRES_USER: kfchess
  POSTGRES_PASSWORD: kfchess
  POSTGRES_DB: kfchess
  POSTGRES_DSN: postgresql://kfchess:kfchess@postgres:5432/kfchess
  # Stage 7: streaming read replica, not sharding (Server_Design.md
  # section 6) - api.yaml already does envFrom: secretRef:
  # postgres-credentials, so these three keys reach the api pods with no
  # manifest change of their own. REPLICATION_USER/PASSWORD is a
  # dedicated least-privilege role for the primary<->replica WAL stream
  # only (postgres.yaml's init scripts) - unrelated to REPLICA_DSN, which
  # is the ordinary kfchess app user making a normal SQL connection to
  # the replica's own Service.
  POSTGRES_REPLICATION_USER: replicator
  POSTGRES_REPLICATION_PASSWORD: de105d8e6ff46e047e2cc2db782d12cb
  POSTGRES_REPLICA_DSN: postgresql://kfchess:kfchess@postgres-replica:5432/kfchess
