# Server_Design.md section 1's "Observability" row / Stage 6 - scrapes
# every role's own METRICS_PORT (kungfu_chess/server/metrics.py), each
# reporting the scaling metric section 1's own table names for that
# role (request rate, open connections, queue depth, active-room
# count). Never on any player's hot path - read-only telemetry pulled
# from the outside, not called by anything in the request path.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:9100"]
  - job_name: ws-gateway
    static_configs:
      - targets: ["ws-gateway:9100"]
  - job_name: matchmaking
    static_configs:
      - targets: ["matchmaking:9100"]
  - job_name: game-shard
    static_configs:
      - targets: ["game-shard:9100"]
